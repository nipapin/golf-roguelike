<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Golf Rogue — Start</title><link rel="stylesheet" href="style.css">
<style>
:root{--cw:84px;--ol:4px}
.screen{position:relative;width:100vw;height:100vh;overflow:hidden;
  background:radial-gradient(70% 45% at 50% 52%,#FF9A6B 0%,#F0508E 35%,#8C3FD0 70%,#3F2AB8 100%)}
.rays{position:absolute;left:50%;top:52%;width:1400px;height:1400px;transform:translate(-50%,-50%);
  background:repeating-conic-gradient(from 0deg,rgba(255,240,200,.16) 0 7deg,transparent 7deg 18deg);
  -webkit-mask:radial-gradient(closest-side,#000 20%,transparent 75%);mask:radial-gradient(closest-side,#000 20%,transparent 75%)}
svg.land{position:absolute;left:0;right:0;bottom:0;width:100%;height:46%}
.logo{position:absolute;left:0;right:0;top:calc(62px + 1vh);text-align:center;transform:rotate(-4deg)}
.logo .l1,.logo .l2{display:block;font-family:"Lilita One";line-height:.86;letter-spacing:.01em;-webkit-text-stroke:10px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 var(--ink),0 12px 18px rgba(30,0,60,.4)}
.logo .l1{font-size:92px;color:#FFF6E2}
.logo .l2{font-size:104px;text-shadow:none!important;position:relative;z-index:1;background:linear-gradient(180deg,#FFF6A8 0%,#FFD034 38%,#FF8A1F 72%,#F2491E 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:0}
.logo .wrap{position:relative;display:inline-block}
.logo .l2o{position:absolute;left:0;top:0;right:0;bottom:0;z-index:0;font-family:"Lilita One";font-size:104px;line-height:.86;color:var(--ink);-webkit-text-stroke:10px var(--ink);text-shadow:0 7px 0 var(--ink),0 12px 18px rgba(30,0,60,.4);z-index:-1}
.logo .hl{position:absolute;left:0;right:0;top:6%;height:26%;font-family:"Lilita One";font-size:104px;line-height:.86;color:rgba(255,255,255,.0)}
.logo .ribbon{position:relative;display:inline-block;margin-top:14px;padding:6px 26px 8px;background:linear-gradient(180deg,#FF5A6A,#D81E3C);box-shadow:0 0 0 3.5px var(--ink),inset 0 3px 0 rgba(255,255,255,.35),inset 0 -4px 0 rgba(120,0,30,.35);border-radius:6px;
  font:normal 19px/1 "Lilita One";letter-spacing:.12em;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.logo .ribbon::before,.logo .ribbon::after{content:"";position:absolute;top:8px;width:22px;height:100%;background:#A8122E;box-shadow:0 0 0 3.5px var(--ink);z-index:-1}
.logo .ribbon::before{left:-16px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,35% 50%)}
.logo .ribbon::after{right:-16px;clip-path:polygon(0 0,100% 0,65% 50%,100% 100%,0 100%)}
.spade{position:absolute;width:60px;height:60px;left:calc(50% + 118px);top:-18px;transform:rotate(18deg);color:#2C2160;filter:drop-shadow(0 5px 0 var(--ink))}
.stage{position:absolute;left:0;right:0;top:37%;height:38%}
.gob{position:absolute;right:-6px;bottom:7%;height:66%;transform:scaleX(1);filter:drop-shadow(0 6px 0 rgba(40,0,40,.3))}
.gobshadow{position:absolute;right:0;bottom:6%;width:220px;height:34px;border-radius:50%;background:radial-gradient(closest-side,rgba(60,10,50,.5),transparent)}
.bat{position:absolute;right:16px;top:-6%;width:108px;transform:rotate(8deg) scaleX(-1)}
.slime{position:absolute;left:14px;bottom:0;width:70px;z-index:4;transform:rotate(-6deg)}
.fan{position:absolute;left:56px;bottom:26%;width:200px;height:200px;z-index:3}
.fan .card{transform-origin:50% 120%}
.energy{position:absolute;left:48%;top:24%;width:34%;height:44%;z-index:4;
  background:radial-gradient(closest-side,rgba(255,255,255,.9),rgba(255,236,140,.55) 30%,rgba(255,140,60,.2) 60%,transparent 75%)}
.clash{position:absolute;left:calc(50% + 34px);top:36%;width:60px;height:60px;z-index:5;transform:rotate(12deg)}
.beam{position:absolute;height:14px;border-radius:14px;transform-origin:0 50%;filter:blur(1.2px)}
.beam{z-index:6!important}
.bottom{position:absolute;left:0;right:0;bottom:calc(30px + 2vh);display:flex;flex-direction:column;align-items:center;gap:16px}
.tag{font:600 17px/1.2 Fredoka;color:#fff;text-shadow:0 2px 0 var(--ink);letter-spacing:.02em}
.tag b{color:#FFE35A}
.btn.start{width:282px;height:76px;font-size:38px;border-radius:20px;-webkit-text-stroke:4px var(--ink)}
.btn.start::after{top:7px;height:12px;border-radius:12px;left:16px;right:16px}
.startglow{position:absolute;width:340px;height:120px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,220,80,.6),transparent);top:18px;z-index:-1}
.sub{display:flex;gap:12px}
.btn.small{height:48px;font-size:19px;padding:0 16px;border-radius:14px;-webkit-text-stroke:3px var(--ink)}
.btn.icon{width:48px;padding:0}
.btn.icon svg{width:28px;height:28px;fill:#fff;stroke:var(--ink);stroke-width:40;paint-order:stroke}
.best{position:absolute;left:12px;top:56px;display:flex;gap:8px}
.foot{position:absolute;left:0;right:0;bottom:12px;text-align:center;font:500 11px Fredoka;color:rgba(255,255,255,.6)}
.status{position:absolute;left:0;right:0;top:0;height:47px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 10px 34px;font:600 16px/1 Fredoka;color:#fff}
.homebar{position:absolute;left:50%;bottom:8px;width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.75);transform:translateX(-50%)}
</style></head><body>
<script src="sprite.js"></script><script src="cards.js"></script>
<div class="screen">
 <div class="rays"></div>
 <svg class="land" viewBox="0 0 390 390" preserveAspectRatio="xMidYMax slice">
  <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7A3FC2"/><stop offset="1" stop-color="#B04FAE"/></linearGradient>
  <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5A2E9A"/><stop offset="1" stop-color="#3A1F7A"/></linearGradient>
  <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A2A96"/><stop offset="1" stop-color="#1E1460"/></linearGradient></defs>
  <path d="M-10 170 L40 110 L70 140 L120 70 L165 150 L200 120 L240 160 L285 90 L330 140 L400 100 L400 390 L-10 390Z" fill="url(#g1)" stroke="#5A2A8C" stroke-width="3" stroke-linejoin="round"/>
  <path d="M120 70 L134 90 L126 88 L116 102 L108 86Z M285 90 L298 110 L290 107 L280 120 L274 106Z" fill="#FFE3F0" opacity=".75"/>
  <path d="M-10 220 L10 196 L22 214 L36 184 L52 222 L66 200 L82 230 L100 212 L120 240 L400 240 L400 216 L380 190 L366 214 L350 180 L336 214 L322 196 L306 226 L290 208 L276 240 Z" fill="url(#g2)" stroke="#2E1660" stroke-width="3" stroke-linejoin="round"/>
  <path d="M-10 250 C80 236 160 244 220 240 C300 236 350 232 400 238 L400 390 L-10 390Z" fill="url(#g3)" stroke="#140A40" stroke-width="3"/>
  <path d="M-10 256 C80 242 160 250 220 246 C300 242 350 238 400 244" stroke="#6B5AE0" stroke-width="3" fill="none" opacity=".6"/>
  <g fill="#fff" opacity=".08"><path d="M40 300 l10 12 -10 12 -10 -12z"/><circle cx="330" cy="320" r="7"/><path d="M190 350 l8 10 -8 10 -8 -10z"/></g>
 </svg>
 <div class="status"><span>9:41</span><span style="display:flex;gap:6px;align-items:center"><svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><span style="width:24px;height:12px;border:1.5px solid #fff;border-radius:3.5px;display:inline-block"></span></span></div>

 <div class="logo">
   <svg class="spade" viewBox="-8 -8 116 116"><use href="#s-spade"/></svg>
   <span class="l1">GOLF</span>
   <span class="wrap"><span class="l2o">ROGUE</span><span class="l2">ROGUE</span></span><br>
   <span class="ribbon">SOLITAIRE · ROGUELIKE</span>
 </div>

 <div class="stage">
   <img class="bat" src="assets/bat_idle.png" alt="">
   <div class="gobshadow"></div>
   <img class="gob" src="assets/goblin_attack.png" alt="">
   <div class="energy"></div>
   <svg class="clash" viewBox="0 0 120 120"><g stroke="#1B1030" stroke-width="3" stroke-linejoin="round"><path d="M60 4 L70 42 L108 20 L80 54 L116 66 L78 72 L96 108 L62 82 L44 116 L44 78 L8 92 L34 62 L4 40 L42 44 L34 10 Z" fill="#FFE35A"/></g><path d="M60 26 L66 48 L88 38 L72 58 L92 66 L70 70 L78 90 L60 76 L50 96 L50 74 L28 80 L44 62 L26 48 L48 50 L44 30Z" fill="#FFF8D0"/></svg>
   <div class="beam" style="left:200px;top:40%;width:90px;background:linear-gradient(90deg,rgba(255,154,0,0),#FFD34A 60%,#fff);transform:rotate(-8deg);z-index:2"></div>
   <div class="beam" style="left:210px;top:30%;width:80px;height:8px;background:linear-gradient(90deg,rgba(57,217,255,0),#39D9FF 60%,#fff);transform:rotate(4deg);z-index:2"></div>
   <div class="beam" style="left:200px;top:52%;width:90px;height:9px;background:linear-gradient(90deg,rgba(255,59,48,0),#FF5A36 60%,#fff);transform:rotate(-16deg);z-index:2"></div>
   <div class="fan" id="fan"></div>
   <img class="slime" src="assets/slime_idle.png" alt="">
 </div>

 <div class="bottom">
   <div class="tag">Chain cards. <b>Smash monsters.</b></div>
   <div style="position:relative;display:grid;place-items:center"><div class="startglow"></div><div class="btn yellow start">START RUN</div></div>
   <div class="sub"><div class="btn blue small">COLLECTION</div><div class="btn green small">DAILY</div><div class="btn blue small icon"><svg viewBox="0 0 512 512"><use href="#i-cog"/></svg></div></div>
 </div>
 <div class="homebar"></div>
</div>
<script>
const f=document.getElementById('fan');
f.innerHTML=
 card({r:'Q',s:'sp',power:'bomb',x:-4,y:30,style:'transform:rotate(-22deg)',sparks:[[20,30],[70,70]]})+
 card({r:'5',s:'di',power:'wild',x:44,y:4,style:'transform:rotate(-6deg)',sparks:[[15,60],[75,35]]})+
 card({r:'A',s:'sp',power:'crit',x:94,y:10,style:'transform:rotate(12deg)',sparks:[[10,40],[70,65],[40,85]]});
</script>
</body></html>
