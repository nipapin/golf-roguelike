<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Golf Rogue — Battle mockup</title>
<link rel="stylesheet" href="style.css">
<style>
:root{--st:47px;--sb:34px}
@media (max-height:760px){:root{--st:20px;--sb:6px}}
.screen{position:relative;width:100vw;height:100vh;display:flex;flex-direction:column;overflow:hidden;background:#22176A}
/* ---------- TOP: status + HUD + arena (background art lives here) ---------- */
.top{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.top>svg.bg{position:absolute;left:0;right:0;top:0;bottom:-40px;width:100%;height:calc(100% + 40px)}
.status{position:relative;height:var(--st);flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 10px 34px;font:600 16px/1 Fredoka;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)}
@media (max-height:760px){.status{padding:0 12px 3px 14px;font-size:12px}}
.status .r{display:flex;gap:6px;align-items:center}
.status .batt{width:24px;height:12px;border:1.5px solid #fff;border-radius:3.5px;position:relative}.status .batt::after{content:"";position:absolute;inset:1.5px 5px 1.5px 1.5px;background:#fff;border-radius:1.5px}
.hud{position:relative;height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px}
.prog{display:flex;align-items:center;gap:0;height:30px;padding:0 10px 0 6px;border-radius:15px;background:linear-gradient(180deg,rgba(40,20,80,.78),rgba(27,16,48,.86));box-shadow:0 0 0 2.5px var(--ink),inset 0 1.5px 0 rgba(255,255,255,.18)}
.prog .n{width:12px;height:12px;border-radius:50%;background:#4B3A8A;box-shadow:0 0 0 2px var(--ink);margin-right:7px;position:relative}
.prog .n.done{background:#9C8BD9}
.prog .n.done::after{content:"";position:absolute;left:3px;top:1.5px;width:3px;height:6px;border:solid var(--ink);border-width:0 2px 2px 0;transform:rotate(40deg)}
.prog .n.cur{width:22px;height:22px;background:radial-gradient(circle at 40% 35%,#FFF08A,#FFB800);box-shadow:0 0 0 2.5px var(--ink),0 0 10px 2px rgba(255,210,60,.8);display:grid;place-items:center;color:var(--ink);font-size:13px}
.prog .n.cur svg{fill:var(--ink)}
.prog .n.elite{background:#B04BDB}
.prog .n.boss{width:20px;height:20px;background:#E0304A;display:grid;place-items:center;margin-right:0}
.prog .n.boss svg{width:15px;height:15px;fill:#fff}
.prog .lbl{font-family:"Lilita One";font-size:15px;color:#fff;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;margin-left:4px}
.hud .sp{flex:1}
.relics{display:flex;gap:5px}
.relic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(180deg,#6B4BD8,#3F2A9A);box-shadow:0 0 0 2.5px var(--ink),inset 0 2px 0 rgba(255,255,255,.3),inset 0 -3px 0 rgba(0,0,0,.25)}
.relic svg{width:20px;height:20px}
.cogbtn{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(180deg,#6CC2FF 0 48%,#3A9CFF 52%);box-shadow:0 0 0 2.5px var(--ink),inset 0 -4px 0 #1C5FD1,inset 0 2px 0 rgba(255,255,255,.5),0 3px 0 2.5px var(--ink)}
.cogbtn svg{width:20px;height:20px;fill:#fff;stroke:var(--ink);stroke-width:40;paint-order:stroke}

/* ---------- ARENA ---------- */
.arena{position:relative;flex:1 1 auto;min-height:0}
.enemy{position:absolute;left:50%;bottom:84px;height:min(66%,250px);transform:translateX(-46%);filter:drop-shadow(0 4px 0 rgba(60,15,40,.25))}
.eshadow{position:absolute;left:50%;bottom:74px;width:150px;height:26px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(70,20,40,.55),rgba(70,20,40,0))}
.plate{position:absolute;left:50%;bottom:32px;transform:translateX(-50%);width:252px}
.plate .name{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:5px}
.plate .name .t{font-family:"Lilita One";font-size:19px;color:#fff;-webkit-text-stroke:3.5px var(--ink);paint-order:stroke fill;text-shadow:0 2px 0 var(--ink);letter-spacing:.02em}
.plate .lvl{display:grid;place-items:center;height:20px;padding:0 6px;border-radius:6px;background:linear-gradient(180deg,#C77BFF,#8A3BE6);box-shadow:0 0 0 2.5px var(--ink),inset 0 1.5px 0 rgba(255,255,255,.45);font-family:"Lilita One";font-size:12px;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.plate .hpwrap{position:relative;padding-left:22px}
.plate .shieldbadge{left:-2px;top:-10px}
.plate .dmg{position:absolute;right:8px;top:3px;font:normal 15px/1 "Lilita One";color:#FFE35A;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;z-index:3}
.intent{position:absolute;left:calc(50% + 70px);top:6%;min-width:74px;height:50px;padding:0 10px 0 6px;border-radius:18px;display:flex;align-items:center;gap:2px;
  background:linear-gradient(180deg,#FFFFFF,#FFE9EC);box-shadow:0 0 0 3px var(--ink),inset 0 -4px 0 #F5C2CB,0 4px 0 3px rgba(27,16,48,.35)}
.intent::after{content:"";position:absolute;left:10px;bottom:-13px;width:18px;height:16px;background:#FFE9EC;clip-path:polygon(0 0,100% 0,15% 100%);filter:drop-shadow(0 0 0 var(--ink))}
.intent .tail{position:absolute;left:6px;bottom:-17px;width:26px;height:21px;background:var(--ink);clip-path:polygon(0 0,100% 0,14% 100%);z-index:-1}
.intent svg{width:36px;height:36px;fill:#FF3B4E;stroke:var(--ink);stroke-width:44;paint-order:stroke;stroke-linejoin:round;transform:rotate(-10deg)}
.intent b{font-family:"Lilita One";font-weight:400;font-size:32px;color:#FF3B4E;-webkit-text-stroke:3.5px var(--ink);paint-order:stroke fill;text-shadow:0 2px 0 var(--ink)}
.intent .cap{position:absolute;top:-11px;left:50%;transform:translateX(-50%);padding:1px 6px;border-radius:6px;background:var(--ink);font:700 10px/1.2 Fredoka;letter-spacing:.08em;color:#FFD0D6;white-space:nowrap}
.status-fx{position:absolute;left:calc(50% - 128px);top:20%;display:flex;flex-direction:column;gap:6px}
.sfx{width:26px;height:26px;margin-left:2px;border-radius:50%;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 40% 35%,#FFB35C,#E0441E);box-shadow:0 0 0 2.5px var(--ink),inset 0 -3px 0 rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.4)}
.sfx svg{width:17px;height:17px;fill:#fff;stroke:var(--ink);stroke-width:36;paint-order:stroke}
.sfx i{position:absolute;right:-5px;bottom:-4px;font:normal 13px/1 "Lilita One";color:#fff;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill}
.hitpop{position:absolute;left:calc(50% - 118px);top:44%;transform:rotate(-8deg);font-family:"Lilita One";font-size:40px;line-height:1;
  background:linear-gradient(180deg,#FFF6A8 0 30%,#FFB21F 60%,#FF5A1F);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:0;filter:drop-shadow(0 0 0 var(--ink))}
.hitpop-o{position:absolute;left:calc(50% - 118px);top:44%;transform:rotate(-8deg);font-family:"Lilita One";font-size:40px;line-height:1;color:var(--ink);-webkit-text-stroke:7px var(--ink);text-shadow:0 4px 0 var(--ink)}
.burst{position:absolute;left:calc(50% - 138px);top:calc(44% - 20px);width:96px;height:84px;background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,230,120,.7) 40%,rgba(255,150,40,0) 70%)}

/* ---------- COMBO BAND ---------- */
.combo{position:relative;z-index:5;flex:none;height:56px;margin:-14px 8px -22px;border-radius:18px;display:flex;align-items:center;padding:0 10px 0 4px;gap:8px;
  background:linear-gradient(180deg,#FF8A2A 0 45%,#F2491E 55%,#C8252E 100%);
  box-shadow:0 0 0 3px var(--ink),inset 0 2px 0 rgba(255,240,180,.7),inset 0 -5px 0 rgba(120,10,30,.45),0 5px 0 3px rgba(27,16,48,.55),0 0 24px 6px rgba(255,120,40,.55)}
.combo .flame{position:relative;width:74px;height:66px;margin-top:-16px;flex:none}
.combo .flame svg{position:absolute;inset:0;width:100%;height:100%}
.combo .flame .x{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-family:"Lilita One";font-size:34px;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink)}
.combo .mid{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.combo .row1{display:flex;align-items:baseline;gap:6px}
.combo .lbl{font-family:"Lilita One";font-size:20px;color:#FFF3B0;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 2px 0 var(--ink);letter-spacing:.04em}
.combo .tier{font-family:"Lilita One";font-size:13px;color:#fff;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;letter-spacing:.06em}
.combo .chain{margin-left:auto;display:flex;gap:2px}
.combo .chain i{font:normal 11px/15px "Lilita One";width:15px;height:17px;text-align:center;border-radius:4px;background:#FFF6E2;color:var(--ink);box-shadow:0 0 0 1.5px var(--ink);display:block}
.combo .chain i.last{background:#FFE35A}
.track{display:flex;gap:4px;height:14px}
.track .seg{flex:1;position:relative;border-radius:5px;background:rgba(60,5,20,.55);box-shadow:0 0 0 2px var(--ink);overflow:hidden}
.track .seg.full{background:linear-gradient(180deg,#FFF6B0,var(--c) 60%)}
.track .seg.part::before{content:"";position:absolute;left:0;top:0;bottom:0;width:50%;background:linear-gradient(180deg,#FFD0A0,var(--c) 60%);box-shadow:0 0 8px 2px var(--c)}
.track .seg span{position:absolute;inset:0;display:grid;place-items:center;font:normal 10px/1 "Lilita One";color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.combo .dmgp{flex:none;display:flex;align-items:center;gap:2px;height:42px;padding:0 8px 0 4px;border-radius:12px;background:linear-gradient(180deg,#3B0B1E,#5B1230);box-shadow:0 0 0 2.5px var(--ink),inset 0 2px 0 rgba(255,255,255,.12)}
.combo .dmgp svg{width:26px;height:26px;fill:#FFD34A;stroke:var(--ink);stroke-width:44;paint-order:stroke}
.combo .dmgp b{font-family:"Lilita One";font-weight:400;font-size:28px;color:#FFE35A;-webkit-text-stroke:3.5px var(--ink);paint-order:stroke fill;text-shadow:0 2px 0 var(--ink)}
.combo .licks{position:absolute;left:14px;right:14px;top:-15px;width:calc(100% - 28px);height:18px;z-index:-1;filter:drop-shadow(0 0 6px rgba(255,140,40,.8))}
.ember{position:absolute;width:5px;height:5px;border-radius:50%;background:#FFE680;box-shadow:0 0 6px 2px #FF9A1F}

/* ---------- TABLE ---------- */
.table{position:relative;flex:none;border-radius:22px 22px 0 0;padding-top:30px;
  background:
   radial-gradient(90% 60% at 50% 30%,rgba(120,100,255,.35),transparent 70%),
   url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48'><g fill='%23ffffff' opacity='.05'><path d='M12 4 L18 12 L12 20 L6 12Z'/><circle cx='36' cy='36' r='5'/></g></svg>"),
   linear-gradient(180deg,var(--felt-hi),var(--felt) 40%,var(--felt-lo));
  box-shadow:0 0 0 3px var(--ink),inset 0 0 0 7px var(--rim),inset 0 0 0 8.5px var(--ink),inset 0 9px 0 7px var(--rim-hi),inset 0 14px 18px rgba(0,0,0,.35)}
.tableau{position:relative;margin:0 var(--side);height:calc(var(--strip)*4 + var(--ch) + 14px)}
.slot{position:absolute;width:var(--cw);height:var(--ch);border-radius:var(--r);border:2.5px dashed rgba(255,255,255,.22);background:rgba(10,0,40,.18)}
.tray{position:relative;height:calc(var(--ch)*1.42 + 34px);margin:0 8px;border-radius:18px;
  background:linear-gradient(180deg,rgba(15,5,50,.45),rgba(15,5,50,.2));box-shadow:inset 0 3px 0 rgba(0,0,0,.25),inset 0 -1.5px 0 rgba(255,255,255,.12)}
.big-card{--cw:calc(min(calc((100vw - 40px) / 7), 56px) * 1.42);--ol:3px}
.pile{position:absolute;left:14px;top:12px;width:calc(var(--cw)*1.2 + 10px);height:calc(var(--ch)*1.2 + 30px)}
.pile .stack{--cw:calc(min(calc((100vw - 40px) / 7), 56px) * 1.2);--ol:3px;position:relative}
.pile .count{position:absolute;right:-6px;top:-8px;z-index:9;min-width:30px;height:30px;padding:0 6px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(180deg,#FF6B7A,#E0203C);box-shadow:0 0 0 2.5px var(--ink),inset 0 2px 0 rgba(255,255,255,.4);font:normal 17px/1 "Lilita One";color:#fff;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill}
.pile .drawbtn{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);z-index:9;height:28px;padding:0 12px;font-size:17px;border-radius:10px;-webkit-text-stroke:2.5px var(--ink);box-shadow:0 0 0 2.5px var(--ink),inset 0 -4px 0 var(--b-lo),inset 0 2px 0 rgba(255,255,255,.55),0 3px 0 2.5px var(--ink)}
.pile .drawbtn::after{top:3px;height:5px;left:6px;right:6px}
.activezone{position:absolute;left:50%;top:10px;transform:translateX(-44%);width:calc(var(--cw)*1.42*1.9);height:calc(var(--ch)*1.42)}
.activezone .halo{position:absolute;left:30%;top:-14%;width:110%;height:130%;background:radial-gradient(closest-side,rgba(255,170,60,.65),rgba(255,120,40,0));}
.activezone .lab{position:absolute;left:calc(var(--cw)*.55);bottom:-24px;font:normal 12px/1 "Lilita One";letter-spacing:.1em;color:#FFD9A0;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.vitals{position:absolute;right:10px;top:14px;width:118px;display:flex;flex-direction:column;gap:12px}
.vitals .who{display:flex;align-items:center;gap:6px;font-family:"Lilita One";font-size:13px;letter-spacing:.08em;color:#CFC6FF;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.vitals .php{position:relative;padding-left:16px}
.vitals .php .heart{position:absolute;left:-8px;top:-9px;width:40px;height:40px;z-index:2}
.vitals .row{display:flex;gap:8px;align-items:center}
.minichip{display:flex;align-items:center;gap:3px;height:28px;padding:0 9px 0 3px;border-radius:14px;background:linear-gradient(180deg,rgba(20,8,60,.7),rgba(20,8,60,.85));box-shadow:0 0 0 2.5px var(--ink),inset 0 1.5px 0 rgba(255,255,255,.15);font:normal 17px/1 "Lilita One";color:#fff;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill}
.minichip .shieldbadge{position:relative;width:26px;height:29px;margin-left:-6px}
.minichip svg.co{width:24px;height:24px;margin-left:-4px}
.homebar{height:var(--sb);position:relative}
.homebar::after{content:"";position:absolute;left:50%;bottom:8px;width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.75);transform:translateX(-50%)}
@media (max-height:760px){.homebar::after{display:none}
  .hud{height:40px}
  .combo{height:50px;margin:-12px 8px -20px}.combo .flame{width:64px;height:58px;margin-top:-12px}.combo .flame .x{font-size:30px}
  .combo .dmgp{height:38px}.combo .dmgp b{font-size:25px}
  .enemy{height:min(68%,200px);bottom:76px}.eshadow{bottom:68px}.plate{bottom:28px}
  .intent{top:2%;height:44px}.intent b{font-size:28px}.intent svg{width:30px;height:30px}
  .table{padding-top:26px}
  .tableau{height:calc(var(--strip)*4 + var(--ch) + 10px)}
  .tray{height:calc(var(--ch)*1.3 + 22px)}
  .big-card{--cw:calc(min(calc((100vw - 40px) / 7), 56px) * 1.3)}
  .activezone{top:8px}.activezone .lab{display:none}
  .pile{top:6px;height:calc(var(--ch)*1.1 + 16px)}.pile .stack{--cw:calc(min(calc((100vw - 40px) / 7), 56px) * 1.1)}.pile .drawbtn{bottom:0;height:24px;font-size:15px}
  .vitals{top:10px;gap:10px}
}
</style></head><body>
<script src="sprite.js"></script><script src="cards.js"></script>
<div class="screen">
 <section class="top">
  <svg class="bg" viewBox="0 0 390 470" preserveAspectRatio="xMidYMax slice">
   <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3F2AB8"/><stop offset=".28" stop-color="#8C3FD0"/><stop offset=".52" stop-color="#F0508E"/><stop offset=".7" stop-color="#FF8A5C"/><stop offset=".82" stop-color="#FFC27A"/></linearGradient>

   </defs>
   <rect width="390" height="470" fill="url(#sky)"/>

   <!-- palisade right -->
   <g stroke="#4A1E14" stroke-width="2.5" stroke-linejoin="round" fill="#C9743C">
    <path d="M286 352 L286 300 L293 290 L300 300 L300 352Z"/><path d="M300 352 L300 292 L307 281 L314 292 L314 352Z"/><path d="M314 352 L314 298 L321 288 L328 298 L328 352Z"/><path d="M328 352 L328 290 L335 279 L342 290 L342 352Z"/><path d="M342 352 L342 296 L349 286 L356 296 L356 352Z"/><path d="M356 352 L356 292 L363 282 L370 292 L370 352Z"/><path d="M370 352 L370 298 L377 288 L384 298 L384 352Z"/>
    <rect x="282" y="316" width="108" height="8" rx="3" fill="#8E4A22"/>
   </g>

<script>
// shield badges
document.querySelectorAll('.plate .shieldbadge').forEach(e=>e.innerHTML=SHIELD_SVG('#C9D6E8','#7E8FB0')+'<b>4</b>');
document.querySelectorAll('.minichip .shieldbadge').forEach(e=>e.innerHTML=SHIELD_SVG());
// tableau: 7 columns x 5 (top->bottom); last = exposed top card
const C=[
 [['K','cl'],['4','di'],['J','he'],['2','sp'],['9','he','playable']],
 [['6','sp'],['Q','di'],['3','cl'],['A','he'],['5','cl','disabled']],
 [['10','he'],['7','cl'],['K','sp'],['2','di'],['7','di','playable']],
 [['3','he'],['9','cl'],['Q','sp',null,'bomb'],['6','di'],['J','cl','disabled']],
 [['A','cl'],['5','he'],['8','di'],['10','sp','disabled'],null],
 [['4','cl'],['J','sp'],['6','he'],['Q','cl'],['9','sp','playable','crit']],
 [['2','he'],['K','di',null,'gold'],['10','cl'],['4','sp'],['K','he','disabled']],
];
const cs=getComputedStyle(document.documentElement);
const tab=document.getElementById('tab');
const W=tab.clientWidth, cw=(W-6*4)/7, strip=cw*.52;
let h='';
C.forEach((col,i)=>{const x=i*(cw+4);
  col.forEach((c,j)=>{const y=j*strip+4;
    if(!c){h+=`<div class="slot" style="left:${x}px;top:${y}px"></div>`;return}
    const top=(j===col.length-1)||(col[j+1]===null);
    h+=card({r:c[0],s:c[1],state:c[2]||(top?'':'covered'),power:c[3],x,y,z:j+1});
  });
});
tab.innerHTML=h;
// draw pile
document.getElementById('pile').innerHTML=back(8,8)+back(4,4)+back(0,0);
// active card + previous cards fanned behind
const A=document.getElementById('active');
A.innerHTML+=card({r:'6',s:'he',x:4,y:8,style:'transform:rotate(-16deg);filter:brightness(.78)'})
 +card({r:'7',s:'cl',x:14,y:3,style:'transform:rotate(-8deg);filter:brightness(.88)'})
 +card({r:'8',s:'sp',x:26,y:0,style:'box-shadow:0 0 0 3px var(--ink),0 0 0 7px #FFB02E,0 0 0 8.5px var(--ink),inset 0 -6px 0 var(--bevel),inset 0 2px 0 #fff,0 7px 0 rgba(20,8,40,.5),0 0 26px 8px rgba(255,150,40,.6)'})
 +`<div class="lab" style="left:26px">ACTIVE</div>`;
</script>
